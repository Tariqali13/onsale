# Local stack. `docker compose up` for the app; add `--profile observability`
# for Prometheus + Grafana with a pre-built onsale dashboard.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onsale
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/onsale
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173
      ACCESS_TOKEN_SECRET: local-docker-secret-not-for-production-use
      NODE_ENV: development
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes: ['./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    ports: ['9090:9090']

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: ['./infra/grafana:/etc/grafana/provisioning:ro']
    ports: ['3000:3000']
