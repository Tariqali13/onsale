# Render Blueprint for the API (free plan). Postgres comes from Neon and Redis from
# Upstash (both free tiers); paste their URLs when Render prompts for them.
services:
  - type: web
    name: onsale-api
    runtime: docker
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
      - key: ENABLE_SIMULATOR
        value: 'true'
      # Single free instance: keep rate-limit counters in memory to save Upstash commands.
      - key: RATE_LIMIT_STORE
        value: memory
